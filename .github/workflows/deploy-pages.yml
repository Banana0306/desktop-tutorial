name: Deploy JP Racing to GitHub Pages

on:
  push:
    branches:
      - claude/build-company-website-GEArq
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/jp-racing
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
