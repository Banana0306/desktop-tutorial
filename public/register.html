<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Auth Tutorial</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav>
    <span class="brand">Auth Tutorial</span>
    <a href="/">Home</a>
    <a href="/login.html">Login</a>
  </nav>
  <main>
    <div class="card">
      <h1>Create an account</h1>
      <p class="subtitle">Enter a username and password to register.</p>
      <div id="alert" class="alert"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <div class="link-row">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </main>
  <script src="/auth.js"></script>
  <script>
    redirectIfAuthed();
    const alert = document.getElementById('alert');
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      alert.style.display = 'none';

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showAlert(alert, data.error);
        return;
      }
      setToken(data.token);
      setUsername(data.username);
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
